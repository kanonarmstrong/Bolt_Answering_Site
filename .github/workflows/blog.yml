name: Blog

# Rebuilds boltanswering.com/blog from WordPress.
#   - WordPress sends a repository_dispatch (type wp_publish) when a post is published,
#     updated, unpublished or deleted (tools/blog/wordpress/bolt-blog-connector.php).
#   - A daily run catches anything a missed signal left behind.
#   - "Run workflow" on the Actions tab rebuilds on demand.
# The WordPress address is the repository variable WP_BASE_URL (Settings → Secrets and
# variables → Actions → Variables). Until it is set, the build step is skipped.

on:
  repository_dispatch:
    types: [wp_publish]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['tools/blog/**', 'blog/assets/**', '.github/workflows/blog.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/blog/package-lock.json
      - run: npm ci
        working-directory: tools/blog
      - run: npm test
        working-directory: tools/blog
      - name: PHP syntax check (WordPress plugin)
        run: php -l tools/blog/wordpress/bolt-blog-connector.php

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Skip until WordPress is connected
        id: gate
        run: |
          if [ -z "${{ vars.WP_BASE_URL }}" ]; then
            echo "::notice::WP_BASE_URL is not set yet; nothing to build."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != '1'
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != '1'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/blog/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.skip != '1'
        working-directory: tools/blog
      - name: Build blog from WordPress
        if: steps.gate.outputs.skip != '1'
        env:
          WP_BASE_URL: ${{ vars.WP_BASE_URL }}
        run: node tools/blog/build.mjs
      - name: Commit if anything changed
        id: commit
        if: steps.gate.outputs.skip != '1'
        run: |
          git add -A blog sitemap.xml robots.txt llms.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "bolt-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "blog: rebuild from WordPress (${{ github.event.client_payload.reason || github.event_name }})"
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages build request failed; the push may still trigger it."
      - name: Notify Bing and other engines (IndexNow)
        if: steps.commit.outputs.pushed == '1'
        run: node tools/blog/indexnow.mjs || true
